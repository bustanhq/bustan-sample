[project]
name = "bustan-sample"
version = "0.1.0"
description = "A sample bustan API: tasks with recurrence, JWT identity, events, jobs, memory or SQLite storage"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "mosesgameli", email = "mosesgameli20@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "uvicorn[standard]",
    "bustan[starlette]>=2.0.3",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "croniter>=6.2.4",
    "pyyaml>=6.0.3",
    "aiosqlite>=0.22.1",
    "httpx2>=2.16.0",
]

[project.scripts]
bustan-sample-serve = "bustan_sample.app_main:main"
bustan-sample-openapi = "bustan_sample.openapi_export:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "types-croniter>=6.2.4.20261006",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.pytest]
testpaths = ["tests"]
# The test folders mirror src/ and have no __init__.py file, thus two modules
# can each have a test file with the same name (for example
# test_on_user_registered.py). The importlib mode imports each test file from
# its path. tests/ on sys.path makes tests/support importable.
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# BLE: a broad except is allowed only with a noqa comment that gives the cause.
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["bustan_sample"]
known-local-folder = ["support"]
