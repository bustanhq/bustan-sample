openapi: 3.1.0
info:
  title: bustan-sample
  version: 0.1.0
  description: Tasks with recurrence for each user, and the identity routes that give and revoke the bearer
    tokens.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    RegisterRequest:
      additionalProperties: false
      description: The JSON body of POST /identity/register.
      properties:
        email:
          maxLength: 254
          title: Email
          type: string
        password:
          maxLength: 128
          title: Password
          type: string
      required:
      - email
      - password
      title: RegisterRequest
      type: object
    UserResponse:
      description: The JSON shape of a user. It never contains the password hash.
      properties:
        id:
          format: uuid
          title: Id
          type: string
        email:
          title: Email
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
      required:
      - id
      - email
      - created_at
      title: UserResponse
      type: object
    LogInRequest:
      additionalProperties: false
      description: The JSON body of POST /identity/login.
      properties:
        email:
          maxLength: 254
          title: Email
          type: string
        password:
          maxLength: 128
          title: Password
          type: string
      required:
      - email
      - password
      title: LogInRequest
      type: object
    TokenResponse:
      properties:
        access_token:
          title: Access Token
          type: string
        token_type:
          const: bearer
          default: bearer
          title: Token Type
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
      required:
      - access_token
      - expires_at
      title: TokenResponse
      type: object
    TaskStatus:
      enum:
      - todo
      - in_progress
      - done
      title: TaskStatus
      type: string
    TaskResponse:
      description: 'The JSON shape of a task in each response.


        repeat is the rule of a recurring task as a phrase, in the same form for

        each phrase that gives the same rule.'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        title:
          title: Title
          type: string
        description:
          title: Description
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        due_on:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Due On
        repeat:
          anyOf:
          - type: string
          - type: 'null'
          title: Repeat
        created_at:
          format: date-time
          title: Created At
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - title
      - description
      - status
      - due_on
      - repeat
      - created_at
      - updated_at
      title: TaskResponse
      type: object
    CreateTaskRequest:
      additionalProperties: false
      description: The JSON body of POST /tasks.
      properties:
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
        description:
          default: ''
          maxLength: 2000
          title: Description
          type: string
        due_on:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          default: null
          title: Due On
        repeat:
          anyOf:
          - description: A repeat phrase, for example "weekly" or "every 2 weeks on Monday". A recurring
              task must have a due date.
            examples:
            - every 2 weeks on Monday
            maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Repeat
      required:
      - title
      title: CreateTaskRequest
      type: object
    UpdateTaskRequest:
      additionalProperties: false
      description: 'The JSON body of PATCH /tasks/{task_id}.


        A field that the client does not send does not change. A due_on of null

        removes the due date. A repeat of null stops the recurrence.'
      properties:
        title:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Title
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          default: null
          title: Description
        status:
          anyOf:
          - $ref: '#/components/schemas/TaskStatus'
          - type: 'null'
          default: null
        due_on:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          default: null
          title: Due On
        repeat:
          anyOf:
          - description: A repeat phrase, for example "weekly" or "every 2 weeks on Monday". A recurring
              task must have a due date.
            examples:
            - every 2 weeks on Monday
            maxLength: 100
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Repeat
      title: UpdateTaskRequest
      type: object
paths:
  /health/live:
    get:
      operationId: HealthController.live
      responses:
        '200':
          description: Successful Response
  /health/ready:
    get:
      operationId: HealthController.ready
      responses:
        '200':
          description: Successful Response
  /identity/register:
    post:
      operationId: IdentityController.register
      responses:
        '429':
          description: Too many requests from this client
        '409':
          description: A user with this email exists
        '400':
          description: The email or the password is not valid
        '201':
          description: The new user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      tags:
      - identity
      summary: Register a user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
  /identity/login:
    post:
      operationId: IdentityController.log_in
      responses:
        '429':
          description: Too many requests from this client
        '401':
          description: The email or the password is not correct
        '200':
          description: A bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
      tags:
      - identity
      summary: Log in and get an access token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInRequest'
        required: true
  /identity/logout:
    post:
      operationId: IdentityController.log_out
      responses:
        '401':
          description: No valid token
        '204':
          description: The token is revoked
      tags:
      - identity
      summary: Revoke the token of this request
      security:
      - bearer: []
  /identity/me:
    get:
      operationId: IdentityController.me
      responses:
        '401':
          description: No valid token
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      tags:
      - identity
      summary: Get the user of the token
      security:
      - bearer: []
  /tasks:
    get:
      operationId: TasksController.list_tasks
      responses:
        '401':
          description: No valid token
        '400':
          description: The status, the limit or the offset is not valid
        '200':
          description: Your tasks, in the sequence of creation
      tags:
      - tasks
      summary: List your tasks, filtered on status if given
      description: Pages of limit tasks (1 to 100, default 50). If a next page exists, the Link header
        gives it with rel="next".
      security:
      - bearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - todo
          - in_progress
          - done
          nullable: true
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
    post:
      operationId: TasksController.create_task
      responses:
        '401':
          description: No valid token
        '400':
          description: The body or the repeat phrase is not valid
        '201':
          description: The new task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
      tags:
      - tasks
      summary: Add a task, with an optional repeat phrase
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
        required: true
  /tasks/{task_id}:
    get:
      operationId: TasksController.get_task
      responses:
        '404':
          description: You have no task with this id
        '401':
          description: No valid token
        '200':
          description: The task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
      tags:
      - tasks
      summary: Get one of your tasks
      security:
      - bearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: TasksController.update_task
      responses:
        '404':
          description: You have no task with this id
        '401':
          description: No valid token
        '400':
          description: The body or the repeat phrase is not valid
        '200':
          description: The changed task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
      tags:
      - tasks
      summary: Change a task
      description: When a recurring task becomes done, the next task is added.
      security:
      - bearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
        required: true
    delete:
      operationId: TasksController.delete_task
      responses:
        '404':
          description: You have no task with this id
        '401':
          description: No valid token
        '204':
          description: The task is deleted
      tags:
      - tasks
      summary: Delete a task
      security:
      - bearer: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
