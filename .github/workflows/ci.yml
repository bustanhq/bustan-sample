# Continuous integration: lock, lint, types, secrets, commit messages, the
# OpenAPI drift, the tests on both storage backends, and the container image.
# release.yml calls this workflow before it publishes.
# The actions are pinned to a commit. The comment gives the release of the commit.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"

jobs:
  checks:
    name: Lock, lint, types, secrets, OpenAPI and commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      # Before any `uv run`, which can lock the project again.
      - run: uv lock --check
      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ty check
      - run: uv run scripts/check_secrets.py --all
      - run: uv run --frozen bustan-sample-openapi --check
      - if: github.event_name == 'pull_request'
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: uv run scripts/check_commit.py --range "$RANGE"

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the floor of bustan. 3.15 is the Python of the Chainguard image
        # at the pinned digest. Each test with the client fixture runs on the
        # memory backend and on SQLite.
        python: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen pytest -q

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t bustan-sample:ci .
      # The image must start and answer the probes on SQLite.
      - name: Start the image and read the probes
        run: |
          set -euo pipefail
          docker run -d --name app -p 8000:8000 \
            -e IDENTITY_JWT_SECRET="ci-only-secret-$(openssl rand -hex 24)" \
            -e DATABASE_BACKEND=sqlite bustan-sample:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then echo; exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
